# A project in trouble: one healthy, one failing. Exercises the per-group
# severity rollup that turns a project header red.
services:
  db:
    image: busybox:latest
    command: sleep 86400
    labels: { kaj.dev: "1" }
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      retries: 1
  cache:
    image: busybox:latest
    command: sleep 86400
    labels: { kaj.dev: "1" }
    healthcheck:
      test: ["CMD", "false"]
      interval: 3s
      retries: 1

networks:
  default:
    labels: { kaj.dev: "1" }
